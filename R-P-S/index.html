<html>
  <head>
    <title>ROCK PAPER SCISSORS GAME</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>ROCK-PAPER-SCISSORS</h1>

    <div class="display">
      <div id="msgContainer">
        <p id="msg1">User Wins!</p>
      </div>
    </div>
    <div id="container">
      <div class="options" id="rock"></div>
      <div class="options" id="paper"></div>
      <div class="options" id="scissors"></div>
      <p id="user" class="scoreBoard">USER SCORE = 0</p>
      <p id="comp" class="scoreBoard">COMP SCORE = 0</p>
      <p id="draw" class="scoreBoard">DRAW = 0</p>

      <button id="rst">RESTART</button>
    </div>

    <script src="first.js"></script>
  </body>
</html>
